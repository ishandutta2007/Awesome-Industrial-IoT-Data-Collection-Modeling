<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 320"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0f1d"/><stop offset="50%" stop-color="#071527"/><stop offset="100%" stop-color="#0d1b2a"/></linearGradient><linearGradient id="accent-cyan" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#00f2fe"/><stop offset="100%" stop-color="#4facfe"/></linearGradient><linearGradient id="accent-green" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#00e676"/><stop offset="100%" stop-color="#1de9b6"/></linearGradient><linearGradient id="glow-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#00f2fe" stop-opacity=".15"/><stop offset="100%" stop-color="#7928ca" stop-opacity=".05"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#fff" stroke-opacity=".03" stroke-width="1" d="M 40 0 L 0 0 0 40"/><circle cx="40" cy="40" r="1.5" fill="#00f2fe" fill-opacity=".15"/></pattern><style>@keyframes pulse-wave{0%{stroke-dashoffset:1000;opacity:.2}50%{opacity:.8}}@keyframes float-node{0%{transform:translateY(0)}50%{transform:translateY(-6px)}}@keyframes glow-pulse{0%{r:4px;opacity:.5}50%{r:8px;opacity:1}}.badge-text,.subtitle,.title{font-family:system-ui,-apple-system,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title{font-weight:800;fill:#fff}.subtitle{font-weight:500;fill:#94a3b8}.badge-text{font-weight:600;font-size:12px;fill:#00f2fe}.animated-line{stroke-dasharray:20 10;animation:pulse-wave 12s linear infinite}.node-float{animation:float-node 4s ease-in-out infinite}.pulse-dot{animation:glow-pulse 3s ease-in-out infinite}</style></defs><rect width="1200" height="320" fill="url(#bg-grad)" rx="16"/><rect width="1200" height="320" fill="url(#grid)" rx="16"/><rect width="1200" height="320" fill="url(#glow-grad)" rx="16"/><rect width="1198" height="318" x="1" y="1" fill="none" stroke="#00f2fe" stroke-opacity=".2" stroke-width="1.5" rx="15"/><g opacity=".25"><path fill="none" stroke="url(#accent-cyan)" stroke-width="2" d="M 100 260 L 250 260 L 320 200 L 450 200 L 520 270 L 700 270" class="animated-line"/><path fill="none" stroke="url(#accent-green)" stroke-width="2" d="M 750 60 L 880 60 L 950 120 L 1100 120" class="animated-line"/><path fill="none" stroke="#7928ca" stroke-width="2" d="M 800 280 L 920 280 L 1020 180 L 1120 180" class="animated-line"/><circle cx="320" cy="200" r="5" fill="#00f2fe" class="pulse-dot"/><circle cx="520" cy="270" r="5" fill="#00f2fe" class="pulse-dot"/><circle cx="950" cy="120" r="5" fill="#00e676" class="pulse-dot"/><circle cx="1020" cy="180" r="5" fill="#7928ca" class="pulse-dot"/></g><g class="node-float" opacity=".85" transform="translate(920, 65)"><rect width="210" height="42" fill="#0e2238" stroke="#00f2fe" stroke-opacity=".4" stroke-width="1" rx="8"/><circle cx="24" cy="21" r="6" fill="#00e676"/><text x="40" y="26" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="600">MQTT &amp; OPC UA</text></g><g class="node-float" opacity=".85" transform="translate(860, 135)" style="animation-delay:1.5s"><rect width="230" height="42" fill="#0e2238" stroke="#4facfe" stroke-opacity=".4" stroke-width="1" rx="8"/><circle cx="24" cy="21" r="6" fill="#00f2fe"/><text x="40" y="26" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="600">Digital Twin Abstraction</text></g><g class="node-float" opacity=".85" transform="translate(900, 205)" style="animation-delay:2.5s"><rect width="220" height="42" fill="#0e2238" stroke="#7928ca" stroke-opacity=".4" stroke-width="1" rx="8"/><circle cx="24" cy="21" r="6" fill="#ab47bc"/><text x="40" y="26" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="600">Time-Series &amp; Asset Models</text></g><g transform="translate(60, 48)"><rect width="260" height="28" fill="#00f2fe" fill-opacity=".1" stroke="#00f2fe" stroke-opacity=".3" rx="14"/><text x="14" y="18" class="badge-text">⚡ AWESOME INDUSTRIAL IOT ECOSYSTEM</text></g><text x="60" y="125" class="title" font-size="38" letter-spacing="-.5">Industrial IoT Data Collection</text><text x="60" y="170" fill="url(#accent-cyan)" class="title" font-size="38" letter-spacing="-.5">&amp; Asset Modeling</text><text x="60" y="215" class="subtitle" font-size="16"><tspan x="60" dy="0">Curated landscape of Enterprise SaaS Platforms &amp; Open-Source Frameworks</tspan> <tspan x="60" dy="24">for PLC Telemetry, OPC UA Integration, Digital Twins, and Unified Namespaces.</tspan></text><g transform="translate(60, 265)"><rect width="100" height="24" x="0" y="0" fill="#1e293b" rx="12"/><text x="50" y="16" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">🏭 SCADA / PLC</text><rect width="115" height="24" x="110" y="0" fill="#1e293b" rx="12"/><text x="167" y="16" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">🌐 Edge Gateways</text><rect width="110" height="24" x="235" y="0" fill="#1e293b" rx="12"/><text x="290" y="16" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">📊 Time-Series DB</text><rect width="125" height="24" x="355" y="0" fill="#1e293b" rx="12"/><text x="417" y="16" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">💎 Sparkplug B / UNS</text></g></svg>